<style>
  :root{

  .wrap{max-width:1220px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left))}

<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><h1>WARDROBE</h1></div>
  </div>

  <section class="hero">
    <div class="progress-card">
      <div>
        <div class="kicker">BASIC COMPLETION</div>
        <div class="progress-main"><div class="big" id="percent">0%</div><div class="fraction" id="fraction">0 / 0</div></div>
      </div>
      <div class="bar"><span id="progressBar"></span></div>
    </div>
    <div class="stats">
      <button class="stat" data-status-filter="owned" type="button"><b id="ownedCount">0</b><span>Є</span></button>
      <button class="stat" data-status-filter="need" type="button"><b id="needCount">0</b><span>Треба</span></button>
      <button class="stat" data-status-filter="replace" type="button"><b id="replaceCount">0</b><span>Замінити</span></button>
    </div>
  </section>

  <div class="section-head">
    <div><div class="kicker">OVERVIEW</div><h2 id="viewTitle">Огляд гардероба</h2></div>
    <div class="section-head-right">
      <small id="viewCount"></small>
      <button class="small-btn" id="showAllBtn" type="button" style="display:none">Показати все</button>
      <button class="small-btn" id="addCategoryBtn" type="button">+ Категорія</button>
      <button class="btn primary" id="addItemBtn" type="button">+ Додати річ</button>
    </div>
  </div>
  <div class="toolbar"><input id="search" class="search" placeholder="Пошук: bomber, jeans, oakley..." /></div>
  <main id="content"></main>
</div>

<dialog id="itemDialog">
  <form method="dialog" class="modal" id="itemForm">
    <h3 id="modalTitle">Додати річ</h3>
    <div class="form">
      <div class="field"><label>Тип речі</label><input id="fName" required placeholder="Пуховик / Джинси / Бомбер..." /></div>
      <div class="field"><label>Категорія</label><select id="fCategory"></select></div>
      <div class="field"><label>Варіант / колір</label><input id="fVariant" placeholder="чорний / коричневий / light blue..." /></div>
      <div class="field"><label>Статус</label><select id="fStatus"><option value="owned">Є</option><option value="need">Треба</option><option value="replace">Замінити</option></select></div>
      <div class="field full"><label>Примітка</label><textarea id="fNote" placeholder="Fit A, cropped, cotton... "></textarea></div>
      <div class="field full"><label>Фото — URL</label><input id="fImageUrl" placeholder="https://..." /></div>
      <div class="field full"><label>Або завантажити фото</label><input id="fImageFile" type="file" accept="image/*" /></div>
      <div class="field full"><div class="preview" id="preview">Без фото</div></div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn danger hidden" id="deleteBtn">Видалити</button>
      <div class="right">
        <button type="button" class="btn" id="cancelBtn">Скасувати</button>
        <button type="submit" class="btn primary">Зберегти</button>
      </div>
    </div>
  </form>
</dialog>
<div class="toast" id="toast"></div>

<script>

let state=load();
let activeCategory='ALL'; // kept for data compatibility; overview is the only view in v4
let activeFilter='all';
let openCategories=new Set();
let editingId=null;
let uploadedImage='';

function load(){
  try{const raw=localStorage.getItem(STORAGE_KEY); if(raw) return JSON.parse(raw);}catch(e){}
  return {categories:[...initialCategories],items:seed};
}
function save(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
  catch(e){toast('Не влізло в локальне сховище. Спробуй менше фото.');}
}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
function statusText(s){return s==='owned'?'Є':s==='replace'?'Замінити':'Треба'}
function makeId(){return 'i-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}

function render(){
  const baseItems=state.items.filter(i=>i.category!=='JUST WANT');
  const owned=baseItems.filter(i=>i.status==='owned').length;
  const need=baseItems.filter(i=>i.status==='need').length;
  const replace=baseItems.filter(i=>i.status==='replace').length;
  const pct=baseItems.length?Math.round((owned/baseItems.length)*100):0;
  document.getElementById('percent').textContent=pct+'%';
  document.getElementById('fraction').textContent=`${owned} / ${baseItems.length}`;
  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('ownedCount').textContent=owned;
  document.getElementById('needCount').textContent=need;
  document.getElementById('replaceCount').textContent=replace;

  const q=document.getElementById('search').value.trim().toLowerCase();
  let items=[...state.items];
  if(activeFilter!=='all') items=items.filter(i=>i.status===activeFilter);
  if(q) items=items.filter(i=>[i.name,i.variant,i.note,i.category].join(' ').toLowerCase().includes(q));

  const filterLabel=activeFilter==='owned'?'Є':activeFilter==='need'?'Треба':activeFilter==='replace'?'Замінити':'Огляд гардероба';
  document.getElementById('viewTitle').textContent=filterLabel;
  document.getElementById('viewCount').textContent=`${items.length} позицій`;
  document.getElementById('showAllBtn').style.display=activeFilter==='all'?'none':'inline-flex';
  document.querySelectorAll('[data-status-filter]').forEach(b=>b.classList.toggle('active',b.dataset.statusFilter===activeFilter));

  const content=document.getElementById('content');content.innerHTML='';
  if(!items.length){content.innerHTML='<div class="empty">Нічого не знайдено.</div>';return}
  renderAllView(content,items,q);
}

function renderAllView(content,visibleItems,q){
  if(activeFilter==='all' && !q){
    const intro=document.createElement('div');intro.className='all-intro';
    intro.textContent='Натисни на категорію, щоб розгорнути її. Усередині довгі ряди варіантів скроляться вправо.';
    content.appendChild(intro);

    const summary=document.createElement('div');summary.className='category-summary-grid';
    state.categories.forEach(category=>{
      const all=state.items.filter(i=>i.category===category);
      if(!all.length) return;
      const owned=all.filter(i=>i.status==='owned').length;
      const pct=all.length?Math.round(owned/all.length*100):0;
      const b=document.createElement('button');b.type='button';b.className='category-summary';
      b.innerHTML=`<div class="category-summary-top"><span class="category-summary-name">${esc(category)}</span><span class="category-summary-count">${owned}/${all.length}</span></div><div class="mini-bar"><span style="width:${pct}%"></span></div>`;
      b.onclick=()=>toggleCategory(category,true);
      summary.appendChild(b);
    });
    content.appendChild(summary);
  }

  state.categories.forEach(category=>{
    const items=visibleItems.filter(i=>i.category===category);
    if(!items.length) return;
    const all=state.items.filter(i=>i.category===category);
    const owned=all.filter(i=>i.status==='owned').length;
    const need=all.filter(i=>i.status==='need').length;
    const replace=all.filter(i=>i.status==='replace').length;

    const section=document.createElement('section');
    section.className='category-block'+(openCategories.has(category)?' open':'');
    section.dataset.category=category;

    const head=document.createElement('div');head.className='category-block-head';
    head.tabIndex=0;head.setAttribute('role','button');head.setAttribute('aria-expanded',openCategories.has(category)?'true':'false');
    const title=document.createElement('div');title.className='category-block-title';
    title.innerHTML=`<h3>${esc(category)}</h3><span>${owned} є · ${need} треба${replace?` · ${replace} замінити`:''}</span>`;
    const chevron=document.createElement('span');chevron.className='category-chevron';chevron.setAttribute('aria-hidden','true');chevron.textContent='⌄';
    head.append(title,chevron);
    head.onclick=()=>toggleCategory(category,false);
    head.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleCategory(category,false)}};

    const inner=document.createElement('div');inner.className='category-content';
    renderTypeRows(inner,items,category);
    section.append(head,inner);
    content.appendChild(section);
  });
}

function toggleCategory(category,scrollTo=false){
  if(openCategories.has(category)) openCategories.delete(category); else openCategories.add(category);
  render();
  if(scrollTo && openCategories.has(category)){
    requestAnimationFrame(()=>document.querySelector(`.category-block[data-category="${CSS.escape(category)}"]`)?.scrollIntoView({behavior:'smooth',block:'start'}));
  }
}

function renderTypeRows(parent,items,category){
  const list=document.createElement('div');list.className='type-list';
  const groups=[];
  const byName=new Map();
  items.forEach(item=>{
    const key=item.name.trim().toLowerCase();
    if(!byName.has(key)){const group={name:item.name,items:[]};byName.set(key,group);groups.push(group)}
    byName.get(key).items.push(item);
  });

  groups.forEach(group=>{
    const row=document.createElement('article');row.className='type-row';
    const info=document.createElement('div');info.className='type-info';
    const owned=group.items.filter(i=>i.status==='owned').length;
    const need=group.items.filter(i=>i.status==='need').length;
    const replace=group.items.filter(i=>i.status==='replace').length;
    info.innerHTML=`<div class="type-kicker">TYPE</div><h3>${esc(group.name)}</h3><div class="type-count">${owned} є${need?` · ${need} треба`:''}${replace?` · ${replace} замінити`:''}</div>`;
    const addWrap=document.createElement('div');addWrap.className='type-add';
    const addBtn=document.createElement('button');addBtn.textContent='+ Варіант';
    addBtn.onclick=()=>openAdd({category,name:group.name});
    addWrap.appendChild(addBtn);info.appendChild(addWrap);

    const lane=document.createElement('div');lane.className='variant-lane';
    group.items.forEach(item=>lane.appendChild(variantCard(item)));
    const quickAdd=document.createElement('button');quickAdd.className='add-variant-card';quickAdd.innerHTML='+ Додати<br>варіант';
    quickAdd.onclick=()=>openAdd({category,name:group.name});lane.appendChild(quickAdd);
    row.append(info,lane);list.appendChild(row);
  });
  parent.appendChild(list);
}

function variantCard(item){
  const card=document.createElement('article');card.className='variant-card';
  const photo=document.createElement('div');photo.className='variant-photo';
  if(item.image){const img=document.createElement('img');img.src=item.image;img.alt=`${item.name} ${item.variant||''}`;photo.appendChild(img)}
  else{const ph=document.createElement('div');ph.className='variant-placeholder';ph.textContent=item.variant||item.name;photo.appendChild(ph)}
  const badge=document.createElement('span');badge.className='badge '+item.status;badge.textContent=statusText(item.status);photo.appendChild(badge);
  const body=document.createElement('div');body.className='variant-body';
  const title=document.createElement('div');title.className='variant-title';title.textContent=item.variant||'Основний';
  const note=document.createElement('div');note.className='variant-note';note.textContent=item.note||'Без примітки';
  const edit=document.createElement('button');edit.className='variant-edit';edit.textContent='Редагувати';edit.onclick=()=>openEdit(item.id);
  body.append(title,note,edit);card.append(photo,body);return card;
}
function itemCard(item){
  const card=document.createElement('article');card.className='card';
  const photo=document.createElement('div');photo.className='photo';
  if(item.image){const img=document.createElement('img');img.src=item.image;img.alt=item.name;photo.appendChild(img)}
  else{const ph=document.createElement('div');ph.className='placeholder';ph.textContent=item.category;photo.appendChild(ph)}
  const badge=document.createElement('span');badge.className='badge '+item.status;badge.textContent=statusText(item.status);photo.appendChild(badge);
  const body=document.createElement('div');body.className='card-body';
  body.innerHTML=`<h3>${esc(item.name)}</h3><div class="meta">${esc(item.variant||'')}</div><div class="note">${esc(item.note||'')}</div>`;
  const foot=document.createElement('div');foot.className='card-foot';foot.innerHTML=`<span>${esc(item.category)}</span>`;
  const edit=document.createElement('button');edit.className='edit-link';edit.textContent='Редагувати';edit.onclick=()=>openEdit(item.id);foot.appendChild(edit);body.appendChild(foot);
  card.append(photo,body);return card;
}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

function syncCategoryOptions(){
  const select=document.getElementById('fCategory');select.innerHTML='';state.categories.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;select.appendChild(o)});
}
function openAdd(prefill={}){
  editingId=null;uploadedImage='';syncCategoryOptions();
  document.getElementById('modalTitle').textContent='Додати річ';document.getElementById('deleteBtn').classList.add('hidden');
  document.getElementById('fName').value=prefill.name||'';document.getElementById('fCategory').value=prefill.category||state.categories[0];
  document.getElementById('fVariant').value=prefill.variant||'';document.getElementById('fStatus').value='need';document.getElementById('fNote').value='';document.getElementById('fImageUrl').value='';document.getElementById('fImageFile').value='';setPreview('');
  document.getElementById('itemDialog').showModal();
}
function openEdit(id){
  const item=state.items.find(i=>i.id===id);if(!item)return;editingId=id;uploadedImage=item.image||'';syncCategoryOptions();
  document.getElementById('modalTitle').textContent='Редагувати річ';document.getElementById('deleteBtn').classList.remove('hidden');
  document.getElementById('fName').value=item.name;document.getElementById('fCategory').value=item.category;document.getElementById('fVariant').value=item.variant||'';document.getElementById('fStatus').value=item.status;document.getElementById('fNote').value=item.note||'';document.getElementById('fImageUrl').value=item.image?.startsWith('http')?item.image:'';document.getElementById('fImageFile').value='';setPreview(item.image||'');
  document.getElementById('itemDialog').showModal();
}
function setPreview(src){const p=document.getElementById('preview');p.innerHTML='';if(!src){p.textContent='Без фото';return}const img=document.createElement('img');img.src=src;p.appendChild(img)}

async function compressImage(file){
  const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
  const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=data});
  const max=1000;let w=img.width,h=img.height;const scale=Math.min(1,max/Math.max(w,h));w=Math.round(w*scale);h=Math.round(h*scale);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);return c.toDataURL('image/jpeg',.82);
}

document.getElementById('addItemBtn').onclick=()=>openAdd();
document.getElementById('cancelBtn').onclick=()=>document.getElementById('itemDialog').close();
document.getElementById('addCategoryBtn').onclick=()=>{const name=prompt('Назва нової категорії:');if(!name)return;const c=name.trim().toUpperCase();if(!c)return;if(!state.categories.includes(c)){state.categories.push(c);save();render();toast('Категорію додано')}};
document.getElementById('deleteBtn').onclick=()=>{if(!editingId)return;if(confirm('Видалити цю картку?')){state.items=state.items.filter(i=>i.id!==editingId);save();document.getElementById('itemDialog').close();render();toast('Видалено')}};
document.getElementById('search').addEventListener('input',render);
document.querySelectorAll('[data-status-filter]').forEach(b=>b.onclick=()=>{
  activeFilter=activeFilter===b.dataset.statusFilter?'all':b.dataset.statusFilter;
  render();
  document.getElementById('content').scrollIntoView({behavior:'smooth',block:'start'});
});
document.getElementById('showAllBtn').onclick=()=>{activeFilter='all';render()};
document.getElementById('fImageUrl').addEventListener('input',e=>{if(e.target.value.trim()){uploadedImage=e.target.value.trim();setPreview(uploadedImage)}});
document.getElementById('fImageFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;uploadedImage=await compressImage(file);document.getElementById('fImageUrl').value='';setPreview(uploadedImage)});
document.getElementById('itemForm').addEventListener('submit',e=>{
  e.preventDefault();
  const item={id:editingId||makeId(),name:document.getElementById('fName').value.trim(),category:document.getElementById('fCategory').value,variant:document.getElementById('fVariant').value.trim(),status:document.getElementById('fStatus').value,note:document.getElementById('fNote').value.trim(),image:uploadedImage||document.getElementById('fImageUrl').value.trim()};
  if(editingId){const idx=state.items.findIndex(i=>i.id===editingId);state.items[idx]=item}else state.items.unshift(item);
  save();document.getElementById('itemDialog').close();render();toast('Збережено');
});
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
